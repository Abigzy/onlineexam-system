{% extends "base.html" %}
{% load static %}
{% block title %}我的错题本{% endblock %}

{% block extra_css %}
<style>
    .wrong-card { border: 1px solid var(--line-200, #e8edf4); border-radius: 14px; background: #fff;
                  padding: 16px 18px; margin-bottom: 14px; }
    .wrong-card .stem { font-weight: 600; line-height: 1.7; }
    .opt-row { border: 1px solid #eef1f6; border-radius: 10px; padding: 7px 12px; margin-bottom: 6px;
               font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
    .opt-row.correct { background: #f4fbf6; border-color: #bfe6cd; }
    .opt-label { font-weight: 700; color: #4f7cff; min-width: 16px; }
    .opt-row.correct .opt-label { color: #38b27a; }
    .mine-box { background: #fff8f6; border-left: 3px solid #e07a5f; border-radius: 8px;
                padding: 8px 12px; font-size: 13px; white-space: pre-wrap; line-height: 1.7; }
    .ref-box { background: #f4fbf6; border-left: 3px solid #38b27a; border-radius: 8px;
               padding: 8px 12px; font-size: 13px; white-space: pre-wrap; line-height: 1.7; }
    .kp-chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
               background: #eef3ff; color: #3d5cc4; margin: 0 6px 6px 0; }
</style>
{% endblock %}

{% block content %}
<div class="page-head">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h4 class="mb-0">我的错题本</h4>
            <div class="text-muted small">只收录成绩已公开的考试中答错的题</div>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <select class="form-select form-select-sm" id="f-subject" style="min-width:180px">
                <option value="">全部学科</option>
            </select>
            <a href="{% url 'my-exams' %}" class="btn btn-outline-secondary btn-sm">我的考试</a>
        </div>
    </div>
</div>

<div class="container py-4">
    <div class="mb-3 text-muted small" id="summary">加载中…</div>
    <div id="wrong-list"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/api.js' %}"></script>
<script>
(function () {
    'use strict';

    function esc(text) {
        return String(text === null || text === undefined ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function num(value) {
        const v = Number(value || 0);
        return Number.isInteger(v) ? String(v) : v.toFixed(1);
    }

    async function load() {
        const host = document.getElementById('wrong-list');
        host.innerHTML = '<div class="text-center text-muted py-5">加载中…</div>';

        let data;
        try {
            data = await API.get('/grading/wrong-book/', {
                subject: document.getElementById('f-subject').value,
            });
        } catch (err) {
            host.innerHTML = '<div class="text-center text-danger py-5">'
                + esc(UI.errorText(err)) + '</div>';
            return;
        }

        renderSubjects(data.subjects || []);
        document.getElementById('summary').textContent = data.count
            ? '共 ' + data.count + ' 道错题，按错误次数排序'
            : '暂无错题';

        if (!data.count) {
            host.innerHTML = '<div class="text-center text-muted py-5">'
                + '<i class="bi bi-emoji-smile d-block mb-2" style="font-size:36px;opacity:.4"></i>'
                + '还没有错题。成绩未公开的考试不会出现在这里。</div>';
            return;
        }
        host.innerHTML = data.results.map(renderCard).join('');
    }

    function renderSubjects(subjects) {
        const select = document.getElementById('f-subject');
        if (!subjects.length || select.dataset.filled === '1') return;
        select.dataset.filled = '1';
        const current = select.value;
        select.innerHTML = '<option value="">全部学科</option>' + subjects.map(function (name) {
            return '<option value="' + esc(name) + '">' + esc(name) + '</option>';
        }).join('');
        select.value = current;
    }

    function renderCard(row) {
        const correctLabels = String(row.reference_answer || '').toUpperCase();
        let options = '';
        if (row.options && row.options.length) {
            options = row.options.map(function (option) {
                const isCorrect = correctLabels.indexOf(String(option.label).toUpperCase()) >= 0;
                return '<div class="opt-row' + (isCorrect ? ' correct' : '') + '">'
                    + '<span class="opt-label">' + esc(option.label) + '.</span>'
                    + '<span>' + esc(option.content)
                    + (isCorrect ? ' <i class="bi bi-check-circle-fill text-success"></i>' : '')
                    + '</span></div>';
            }).join('');
        }

        const kps = (row.knowledge_points || []).map(function (kp) {
            return '<span class="kp-chip">' + esc(kp.full_path || kp.name) + '</span>';
        }).join('');

        return '<div class="wrong-card">'
            + '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">'
            + '<div class="d-flex flex-wrap align-items-center gap-2">'
            + '<span class="badge badge-soft badge-soft-red">错 ' + row.wrong_count + ' 次</span>'
            + '<span class="badge badge-soft badge-soft-teal">' + esc(row.type_display) + '</span>'
            + '<span class="text-muted small">最近一次：' + esc(row.last_wrong_at || '—') + '</span>'
            + '</div>'
            + '<div class="small text-muted">来自《' + esc(row.exam_title) + '》· 得分 '
            + num(row.last_score) + ' / ' + num(row.full_score) + '</div>'
            + '</div>'
            + '<div class="stem mt-2">' + esc(row.stem) + '</div>'
            + (options ? '<div class="mt-2">' + options + '</div>' : '')
            + '<div class="mt-2"><div class="small text-muted mb-1">我的作答</div>'
            + '<div class="mine-box">' + esc(row.last_answer || '未作答') + '</div></div>'
            + '<div class="mt-2"><div class="small text-muted mb-1">参考答案</div>'
            + '<div class="ref-box">' + esc(row.reference_answer || '（无参考答案）')
            + (row.analysis ? '\n\n解析：' + esc(row.analysis) : '') + '</div></div>'
            + (kps ? '<div class="mt-3">' + kps + '</div>' : '')
            + '</div>';
    }

    document.getElementById('f-subject').addEventListener('change', load);
    load();
})();
</script>
{% endblock %}
